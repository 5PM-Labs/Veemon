name: veemon_mobile
description: "Veemon mobile client (Flutter) — talks to the Go API in apps/api."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Cubit) — see .claude/rules/flutter-architecture.md
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # DI — injectable annotations generate get_it registrations
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Models + functional error handling (Either<Failure, T>)
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Infra
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mockito: ^5.8.1

flutter:
  uses-material-design: true
  generate: true
