# `flutter analyze` must report ZERO issues (.claude/rules/flutter-coding-standards.md).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/*.mocks.dart"
    - lib/core/language/gen/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore # @JsonKey on freezed factory params

linter:
  rules:
    always_declare_return_types: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    unawaited_futures: true
    use_build_context_synchronously: true
