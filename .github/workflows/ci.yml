name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# A new push to the same ref cancels the previous in-flight run: only the tip
# matters, and CI minutes are finite.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.9"
  # Pinned, not `latest`: an action release must not silently change the gate.
  GOLANGCI_LINT_VERSION: "v2.12.2"
  FLUTTER_VERSION: "3.47.7"
  # Pinned to the version used locally (`bun --version`).
  BUN_VERSION: "1.4.3"

jobs:
  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt (fail on diff)
        run: |
          out=$(gofmt -l cmd internal examples 2>&1)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test (Go, race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - run: go mod download

      - name: Run tests
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veemon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: veemon_test
      DB_SSL_MODE: disable
      DB_TIMEZONE: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      # The migrations are the schema under test: apply the real ones rather
      # than an ORM-derived schema, so a broken migration fails CI here.
      - name: Apply migrations
        run: go run ./cmd/migrate up

      - name: Run integration tests
        run: go test -race -count=1 -tags integration ./internal/repository/...

  vuln:
    name: Vulnerability Scan (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  vuln-js:
    name: Vulnerability Scan (JS/Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Single source of truth for accepted, unpatched advisories:
      # .claude/rules/supply-chain-security.md — anything else fails.
      - name: Audit JS dependencies
        run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm

  build:
    name: Build (Go)
    runs-on: ubuntu-latest
    needs: [lint, test, integration, vuln]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build binaries
        run: |
          go build -ldflags="-s -w" -o bin/server ./cmd/server
          go build -ldflags="-s -w" -o bin/migrate ./cmd/migrate
          go build -ldflags="-s -w" -o bin/worker ./cmd/worker

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/
          retention-days: 7

  frontend:
    name: Frontend (TS workspaces)
    runs-on: ubuntu-latest
    needs: [vuln-js]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build api-client (types consumed by web + ai)
        run: bun run build:client

      - run: bun run typecheck
      - run: bun run test:ts
      - run: bun run build:web

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: make gen
      - run: make format-check
      - run: make analyze
      - run: make test

  # Docker images are NOT built on every push (they are slow and the binaries
  # are already validated by `build`). Use the manual "Docker" workflow
  # (.github/workflows/docker.yml) when an image is needed.
