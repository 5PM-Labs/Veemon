version: v2
# buf runs from the repo root; the Go module lives at the repo root.
# Output paths mirror the proto import path under internal/handler/grpc:
#   contract/user/user.proto          -> internal/handler/grpc/user/user.pb.go
#   contract/veemon/annotations.proto -> internal/handler/grpc/veemon/annotations.pb.go
plugins:
  - local: protoc-gen-go
    out: internal/handler/grpc
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/handler/grpc
    opt: paths=source_relative
  # Generates Fiber route registration from veemon.route options. Built into
  # ./bin by `make proto` before buf runs.
  - local: bin/protoc-gen-fiber
    out: internal/handler/grpc
    opt: paths=source_relative
  # TypeScript message types (protobuf-es) shared by apps/web and apps/ai.
  # Resolved from the api-client workspace's local bin (Bun isolated store).
  - local: packages/api-client/node_modules/.bin/protoc-gen-es
    out: packages/api-client/src/gen
    opt:
      - target=ts
      - import_extension=js
