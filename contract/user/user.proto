syntax = "proto3";
package user;
option go_package = "github.com/5PM-Labs/veemon/internal/handler/grpc/user";

import "google/protobuf/empty.proto";
import "veemon/annotations.proto";

// UserApi is exposed over both gRPC and REST. The REST surface is declared
// inline via veemon.route options and generated by protoc-gen-fiber — there is no
// hand-written route table.
service UserApi {
    // Public endpoint - no auth required
    rpc Register(RegisterReq) returns (RegisterRes) {
        option (veemon.route) = {
            method: "POST"
            path: "/api/v1/auth/register"
            body: true
            response: RESPONSE_STYLE_CREATED
            rate_limit: { max: 10 window_seconds: 60 }
        };
    }

    // Public endpoint - no auth required
    rpc Login(LoginReq) returns (LoginRes) {
        option (veemon.route) = {
            method: "POST"
            path: "/api/v1/auth/login"
            body: true
            rate_limit: { max: 10 window_seconds: 60 }
        };
    }

    // Public — verifies an Auth0 access token and issues a first-party token.
    rpc Auth0Login(Auth0LoginReq) returns (LoginRes) {
        option (veemon.route) = {
            method: "POST"
            path: "/api/v1/auth/auth0/login"
            body: true
        };
    }

    // Protected endpoint - requires valid token
    rpc RefreshToken(RefreshTokenReq) returns (RefreshTokenRes) {
        option (veemon.route) = {
            method: "POST"
            path: "/api/v1/auth/refresh"
            auth: { required: true }
        };
    }

    // Protected endpoint - requires authentication
    rpc GetMe(google.protobuf.Empty) returns (UserProfile) {
        option (veemon.route) = {
            method: "GET"
            path: "/api/v1/auth/me"
            auth: { required: true }
        };
    }

    // Protected endpoint - invalidates session
    rpc Logout(google.protobuf.Empty) returns (LogoutRes) {
        option (veemon.route) = {
            method: "POST"
            path: "/api/v1/auth/logout"
            auth: { required: true }
        };
    }

    // Admin endpoint - list all users
    rpc ListUsers(ListUsersReq) returns (ListUsersRes) {
        option (veemon.route) = {
            method: "GET"
            path: "/api/v1/users"
            response: RESPONSE_STYLE_LIST
            auth: { required: true permissions: ["users:read"] }
        };
    }

    // Admin endpoint - get user by ID
    rpc GetUser(GetUserReq) returns (UserProfile) {
        option (veemon.route) = {
            method: "GET"
            path: "/api/v1/users/{id}"
            auth: { required: true permissions: ["users:read"] }
        };
    }

    // Admin endpoint - update user by ID
    rpc UpdateUser(UpdateUserReq) returns (UserProfile) {
        option (veemon.route) = {
            method: "PUT"
            path: "/api/v1/users/{id}"
            body: true
            auth: { required: true permissions: ["users:update"] }
        };
    }

    // Admin endpoint - soft-delete user
    rpc DeleteUser(DeleteUserReq) returns (DeleteUserRes) {
        option (veemon.route) = {
            method: "DELETE"
            path: "/api/v1/users/{id}"
            auth: { required: true permissions: ["users:delete"] }
        };
    }
}

message RegisterReq {
    string email = 1 [json_name = "email"];
    string password = 2 [json_name = "password"];
    string name = 3 [json_name = "name"];
    string phone = 4 [json_name = "phone"];
}

message RegisterRes {
    string id = 1 [json_name = "id"];
    string email = 2 [json_name = "email"];
    string name = 3 [json_name = "name"];
}

message LoginReq {
    string email = 1 [json_name = "email"];
    string password = 2 [json_name = "password"];
}

message LoginRes {
    string token = 1 [json_name = "token"];
    UserProfile user = 2 [json_name = "user"];
}

message Auth0LoginReq {
    // Auth0 access token (RS256 JWT) from the Authorization Code + PKCE flow.
    string access_token = 1 [json_name = "accessToken"];
}

message RefreshTokenReq {
    string token = 1 [json_name = "token"];
}

message RefreshTokenRes {
    string token = 1 [json_name = "token"];
}

message LogoutRes {
    string message = 1 [json_name = "message"];
}

message UserProfile {
    string id = 1 [json_name = "id"];
    string email = 2 [json_name = "email"];
    string name = 3 [json_name = "name"];
    string phone = 4 [json_name = "phone"];
    string status = 5 [json_name = "status"];
    string created_at = 6 [json_name = "createdAt"];
    string avatar_url = 7 [json_name = "avatarUrl"];
    string locale = 8 [json_name = "locale"];
    string timezone = 9 [json_name = "timezone"];
    bool email_verified = 10 [json_name = "emailVerified"];
    bool mfa_enabled = 11 [json_name = "mfaEnabled"];
    string auth_provider = 12 [json_name = "authProvider"];
    string company_code = 13 [json_name = "companyCode"];
    repeated string roles = 14 [json_name = "roles"];
    repeated string permissions = 15 [json_name = "permissions"];
    string last_login_at = 16 [json_name = "lastLoginAt"];
}

message ListUsersReq {
    int32 page = 1 [json_name = "page"];
    int32 size = 2 [json_name = "size"];
    string search = 3 [json_name = "search"];
    string sort_by = 4 [json_name = "sortBy"];
    string sort_order = 5 [json_name = "sortOrder"];
}

message ListUsersRes {
    repeated UserProfile users = 1 [json_name = "users"];
    Pagination pagination = 2 [json_name = "pagination"];
}

message Pagination {
    int32 page = 1 [json_name = "page"];
    int32 size = 2 [json_name = "size"];
    int64 total = 3 [json_name = "total"];
    int32 total_pages = 4 [json_name = "totalPages"];
}

message GetUserReq {
    string id = 1 [json_name = "id"];
}

message UpdateUserReq {
    string id = 1 [json_name = "id"];
    string name = 2 [json_name = "name"];
    string phone = 3 [json_name = "phone"];
    string status = 4 [json_name = "status"];
}

message DeleteUserReq {
    string id = 1 [json_name = "id"];
}

message DeleteUserRes {
    string message = 1 [json_name = "message"];
}
